<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="和音の学習">
<title>和音の学習・テスト</title>
<style>
  :root { --bg: #f6f6f4; --panel: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #dcdcd8;
    --accent: #2f6fde; --test: #e0662f; --test-bg: #fff4ee; --ok: #1e8a4c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); min-height: 100dvh;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 620px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 18px; }
  h1 { margin: 0; font-size: clamp(24px, 6.5vw, 32px); font-weight: 800; text-align: center; }
  .lead { margin: 0; text-align: center; font-size: 16px; line-height: 1.8; color: var(--muted); }
  .lead b { color: var(--text); }

  /* 手順（上から順に進む） */
  ol.flow { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .step { position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding-bottom: 22px; }
  .step:last-child { padding-bottom: 0; }
  .step::before { content: ""; position: absolute; left: 21px; top: 44px; bottom: 0; width: 2px; background: var(--line); }
  .step:last-child::before { display: none; }
  .num { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-weight: 800;
    background: #fff; border: 2px solid var(--line); color: var(--muted); position: relative; z-index: 1; }
  .step.test .num { border-color: var(--test); color: var(--test); }
  .step.learn .num { border-color: var(--accent); color: var(--accent); }
  .step.is-done .num { background: var(--ok); border-color: var(--ok); color: #fff; font-size: 0; }
  .step.is-done .num::after { content: "✓"; font-size: 22px; }
  .body { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .label { font-size: 13px; font-weight: 700; letter-spacing: .05em; padding-top: 2px; }
  .step.test .label { color: var(--test); } .step.learn .label { color: var(--accent); }
  .when { font-size: 13px; color: var(--muted); margin-top: -4px; }

  a.item { display: flex; flex-direction: column; justify-content: center; gap: 4px; min-height: 84px; padding: 14px 16px; background: var(--panel);
    border: 2px solid var(--line); border-radius: 16px; color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; transition: transform .06s, border-color .06s; position: relative; }
  a.item:active { transform: scale(.98); }
  .step.test a.item { border-color: #f3c3a9; background: var(--test-bg); }
  @media (hover: hover) { a.item:hover { border-color: var(--accent); } .step.test a.item:hover { border-color: var(--test); } }
  .name { font-size: 21px; font-weight: 800; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .name::after { content: "›"; color: var(--accent); font-size: 26px; font-weight: 400; }
  .step.test .name::after { color: var(--test); }
  .sub { font-size: 13px; color: var(--muted); }
  .done { font-size: 13px; font-weight: 700; color: var(--ok); }
  .done:empty { display: none; }
  a.item.is-done { border-color: #bfe3cc !important; background: #f6fcf8 !important; }
  .days { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .days a.item { min-height: 76px; }
  @media (min-width: 560px) { .days { grid-template-columns: repeat(4, 1fr); } }

  /* 次にやる項目 */
  a.item.next { border-color: var(--accent) !important; box-shadow: 0 0 0 4px rgba(47,111,222,.15); }
  .step.test a.item.next { border-color: var(--test) !important; box-shadow: 0 0 0 4px rgba(224,102,47,.18); }
  a.item.next::before { content: "次はここ"; position: absolute; top: -11px; right: 12px; font-size: 12px; font-weight: 800; color: #fff;
    background: var(--accent); border-radius: 999px; padding: 2px 10px; }
  .step.test a.item.next::before { background: var(--test); }

  .note { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.7; margin: 4px 0 0; }
</style>
</head>
<body>
<main>
  <h1>和音の学習・テスト</h1>
  <p class="lead"><b>上から順番に</b>進めてください。<br>はじめと最後に<b>テスト</b>があります。</p>

  <ol class="flow">
    <li class="step test" id="stepPre">
      <div class="num">1</div>
      <div class="body">
        <div class="label">はじめに：テスト</div>
        <div class="when">学習を始める前に1回</div>
        <a class="item" href="../index.html" id="preLink">
          <span class="name">最初のテスト</span>
          <span class="sub">2つのコード進行を聴いて，同じかどうかを答えます</span>
          <span class="done"></span>
        </a>
      </div>
    </li>

    <li class="step learn" id="stepLearn">
      <div class="num">2</div>
      <div class="body">
        <div class="label">学習（1日1回）</div>
        <div class="when">1日目から順に，1日1回ずつ</div>
        <div class="days">
          <a class="item" href="day1.html" data-day="1"><span class="name">1日目</span><span class="done"></span></a>
          <a class="item" href="day2.html" data-day="2"><span class="name">2日目</span><span class="done"></span></a>
          <a class="item" href="day3.html" data-day="3"><span class="name">3日目</span><span class="done"></span></a>
          <a class="item" href="day4.html" data-day="4"><span class="name">4日目</span><span class="done"></span></a>
        </div>
      </div>
    </li>

    <li class="step test" id="stepPost">
      <div class="num">3</div>
      <div class="body">
        <div class="label">最後に：テスト</div>
        <div class="when">4日目の学習が終わったあとに1回</div>
        <a class="item" href="../index.html" id="postLink">
          <span class="name">最後のテスト</span>
          <span class="sub">最初のテストと同じ形式です</span>
          <span class="done"></span>
        </a>
      </div>
    </li>
  </ol>

  <p class="note">✓ はこの端末で終えた項目です（別の端末で行った分は表示されません）。</p>
</main>
<script>
/* この端末で終えた項目に ✓ を付け，次にやる項目を目立たせる（学習・テストの各ページが端末内に残す控えを参照） */
const GROUP = "match";
const md = s => { const d = new Date(s); return isNaN(d) ? "" : `${d.getMonth() + 1}/${d.getDate()}`; };
const read = k => { try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch (e) { return []; } };
const mark = (el, when) => {
  el.classList.add("is-done");
  el.querySelector(".done").textContent = `✓ 完了（${md(when)}）`;
};

const learn = read("chord_learning_archive").filter(e => (e.group || GROUP) === GROUP);
const dayDone = {};
document.querySelectorAll("[data-day]").forEach(el => {
  const list = learn.filter(e => String(e.day) === el.dataset.day).map(e => e.start).filter(Boolean).sort();
  if (list.length) { dayDone[el.dataset.day] = list[list.length - 1]; mark(el, list[list.length - 1]); }
});
const tests = read("tonality_test_archive")
  .map(p => p.summary_obj && (p.summary_obj.end_time || p.summary_obj.start_time)).filter(Boolean).sort();

// 最初のテスト：1回目のテスト。最後のテスト：4日目の学習のあとに受けたテスト（なければ2回目以降のテスト）
const pre = tests[0];
const day4 = dayDone["4"];
const post = tests.slice(1).find(t => !day4 || new Date(t) > new Date(day4)) || null;
if (pre) { mark(document.getElementById("preLink"), pre); document.getElementById("stepPre").classList.add("is-done"); }
if (post) { mark(document.getElementById("postLink"), post); document.getElementById("stepPost").classList.add("is-done"); }
if (["1", "2", "3", "4"].every(d => dayDone[d])) document.getElementById("stepLearn").classList.add("is-done");

// 次にやる項目
const nextDay = ["1", "2", "3", "4"].find(d => !dayDone[d]);
const next = !pre ? document.getElementById("preLink")
  : nextDay ? document.querySelector(`[data-day="${nextDay}"]`)
  : !post ? document.getElementById("postLink") : null;
if (next) next.classList.add("next");
</script>
</body>
</html>
